name: pytest

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10; source capture's columns need 3.11+
        # (those tests skip on 3.10).
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Every uv call, including the ones tests/unit/test_library_sources.py
      # runs offline, uses the matrix Python, whose deps the sync step cached.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        # --locked: fail if uv.lock is out of date with pyproject.toml.
        run: uv sync --dev --locked
      - name: Test with pytest
        run: uv run --locked pytest tests -q
